version: 1
modules:
  - repository-profile
  - agent-routing
  - project-knowledge
  - verification
  - orchestration
  - learning
roots:
  - .
entrypoints:
  - AGENTS.md
context:
  budgetBytes: 48000
  documentWarningBytes: 24000
autonomy:
  default: 0
  implementation: 2
  review: 3
  merge: 0
  delivery: 0
agents:
  default: manual
  adapters:
    manual:
      type: manual
budgets:
  workerCalls: 2
  reviewerCalls: 2
  repairIterations: 1
  outputBytes: 65536
sensitivePaths: []
retention:
  evidenceDays: 30
  maximumRuns: 100
