<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Noxroot</title>
  <desc id="desc">Noxroot owl mark and angular purple wordmark on a near-black background.</desc>
  <defs>
    <linearGradient id="markGradient" x1="38" y1="39" x2="308" y2="219" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="0.38" stop-color="#A78BFA"/>
      <stop offset="0.72" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="0.18" stop-color="#DDD6FE"/>
      <stop offset="0.68" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bandGradient" x1="0" y1="124" x2="0" y2="180" gradientUnits="userSpaceOnUse">
