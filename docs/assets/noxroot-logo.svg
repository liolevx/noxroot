    <use xlink:href="#word" transform="translate(7 8)" fill="#2E1065" stroke="#7C3AED" stroke-width="2"/>
    <use xlink:href="#word" fill="url(#wordGradient)" stroke="#F5F3FF" stroke-width="1.5"/>
    <g clip-path="url(#lowerBand)">
