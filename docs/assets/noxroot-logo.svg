      <path d="m308 39-108 64-26 56 27-25 89-50Z"/>
      <path d="m269 115-16 9-1 24-14 16-15 4-25-8 20 23 15 2 33-20Z"/>
      <path d="m77 115 3 50 33 20 13-1 22-24-26 8-14-4-14-16-1-24Z"/>
      <path d="m168 168-15 24 20 27 19-29-15-22Z"/>
      <path d="m237 133-23 13 10 5 7-1 5-6Z"/>
      <path d="m109 133 1 12 5 5 7 1 10-5Z"/>
    </g>
    <g id="word" fill-rule="evenodd">
      <path d="M0 180V0h31l62 113V0h34v180H96L34 67v113Z"/>
      <path d="M149 19 168 0h82l19 19v142l-19 19h-82l-19-19Zm37 18v106h46V37Z"/>
      <path d="M291 0h40l23 53 23-53h40l-42 90 42 90h-40l-23-53-23 53h-40l42-90Z"/>
      <path d="M439 180V0h88l23 22v68l-22 21 31 69h-41l-27-62h-16v62Zm36-144v48h39V36Z"/>
      <path d="m580 19 19-19h82l19 19v142l-19 19h-82l-19-19Zm37 18v106h46V37Z"/>
      <path d="m722 19 19-19h82l19 19v142l-19 19h-82l-19-19Zm37 18v106h46V37Z"/>
      <path d="M857 0h134v38h-48v142h-38V38h-48Z"/>
    </g>
  </defs>

  <rect x="16" y="16" width="1568" height="408" rx="28" fill="#090612"/>
  <rect x="17" y="17" width="1566" height="406" rx="27" fill="none" stroke="#2E1A47" stroke-width="2"/>
  <ellipse cx="175" cy="222" rx="126" ry="92" fill="#8B5CF6" opacity="0.12" filter="url(#glow)"/>

  <g transform="translate(34 118) scale(.82)" fill="#8B5CF6" opacity="0.18">
