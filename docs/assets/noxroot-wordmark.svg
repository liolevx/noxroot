<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="wordmark-title wordmark-desc">
  <title id="wordmark-title">NOXROOT</title>
  <desc id="wordmark-desc">A bold gold NOXROOT wordmark with violet and amber offset outlines on a transparent background.</desc>
  <defs>
    <clipPath id="word-shape">
      <text x="600" y="178" text-anchor="middle" font-family="Arial Black, Segoe UI Black, Impact, sans-serif" font-size="168" font-weight="900" letter-spacing="7">NOXROOT</text>
    </clipPath>
  </defs>
  <g font-family="Arial Black, Segoe UI Black, Impact, sans-serif" font-size="168" font-weight="900" letter-spacing="7" text-anchor="middle">
    <text x="616" y="194" fill="none" stroke="#32165A" stroke-width="13" stroke-linejoin="bevel">NOXROOT</text>
    <text x="608" y="186" fill="none" stroke="#D56A1F" stroke-width="7" stroke-linejoin="bevel">NOXROOT</text>
    <text x="600" y="178" fill="#F4C928" stroke="#24123D" stroke-width="5" stroke-linejoin="bevel" paint-order="stroke fill">NOXROOT</text>
  </g>
  <g clip-path="url(#word-shape)">
