<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Noxroot task workflow</title>
  <desc id="description">Repository code, documentation, tests, and verification policy feed a sequence from a task through bounded context, the developer's existing coding agent, affected approved checks, independent review, and proposed validated learning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <style>
      .node { fill: #172033; stroke: #64748b; stroke-width: 2; rx: 14; }
      .input { fill: #334155; stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .label { fill: #f8fafc; font: 600 18px system-ui, sans-serif; text-anchor: middle; }
      .small { fill: #e2e8f0; font: 500 16px system-ui, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .feed { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="input" x="125" y="28" width="170" height="48" />
  <text class="small" x="210" y="58">Code</text>
  <rect class="input" x="325" y="28" width="220" height="48" />
  <text class="small" x="435" y="58">Docs + instructions</text>
  <rect class="input" x="575" y="28" width="170" height="48" />
  <text class="small" x="660" y="58">Tests</text>
  <rect class="input" x="775" y="28" width="250" height="48" />
  <text class="small" x="900" y="58">Verification policy</text>

  <path class="feed" d="M 210 76 V 118 H 290 V 168" />
  <path class="feed" d="M 435 76 V 118 H 290 V 168" />
  <path class="feed" d="M 660 76 V 118 H 690 V 168" />
  <path class="feed" d="M 900 76 V 118 H 690 V 168" />

  <rect class="node" x="25" y="170" width="160" height="100" />
  <text class="label" x="105" y="226">Task</text>

  <rect class="node" x="215" y="170" width="160" height="100" />
  <text class="label" x="295" y="210">
    <tspan x="295" dy="0">Bounded</tspan>
    <tspan x="295" dy="24">context</tspan>
  </text>

  <rect class="node" x="405" y="170" width="160" height="100" />
  <text class="label" x="485" y="204">
    <tspan x="485" dy="0">Your coding</tspan>
    <tspan x="485" dy="24">agent</tspan>
  </text>
  <text class="small" x="485" y="252">manual/configured</text>

  <rect class="node" x="595" y="170" width="160" height="100" />
  <text class="label" x="675" y="204">
    <tspan x="675" dy="0">Affected</tspan>
    <tspan x="675" dy="24">checks</tspan>
  </text>
  <text class="small" x="675" y="252">approved</text>

  <rect class="node" x="785" y="170" width="160" height="100" />
  <text class="label" x="865" y="204">
    <tspan x="865" dy="0">Independent</tspan>
    <tspan x="865" dy="24">review</tspan>
  </text>

  <rect class="node" x="975" y="170" width="200" height="100" />
  <text class="label" x="1075" y="204">
    <tspan x="1075" dy="0">Proposed</tspan>
    <tspan x="1075" dy="24">validated learning</tspan>
  </text>

  <path class="line" d="M 185 220 H 211" />
  <path class="line" d="M 375 220 H 401" />
  <path class="line" d="M 565 220 H 591" />
  <path class="line" d="M 755 220 H 781" />
  <path class="line" d="M 945 220 H 971" />

  <text class="small" x="600" y="335">Noxroot coordinates evidence around your existing coding agent.</text>
  <text class="small" x="600" y="365">It does not contain the coding model, merge code, deploy, or store application runtime data.</text>
</svg>
