<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">How Noxroot works with a coding agent</title>
  <desc id="workflow-desc">Four steps move left to right: repository and task, Noxroot selects relevant context, the existing coding agent builds, and Noxroot checks the change and retains useful project knowledge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#8B5CF6"/>
    </marker>
    <style>
      .card{fill:#120B20;stroke:#4C386E;stroke-width:3}.agent{fill:#191724;stroke:#DDD6FE}.title{fill:#F5F3FF;font:700 42px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.flow{stroke:#8B5CF6;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="#090612"/>
  <rect class="card" x="28" y="48" width="250" height="204" rx="18"/>
  <text class="title" x="153" y="135">Repo</text><text class="title" x="153" y="188">+ task</text>
  <path class="flow" d="M287 150h42"/>
  <rect class="card" x="340" y="48" width="250" height="204" rx="18"/>
  <text class="title" x="465" y="135">Relevant</text><text class="title" x="465" y="188">context</text>
  <path class="flow" d="M599 150h42"/>
  <rect class="card agent" x="652" y="48" width="250" height="204" rx="18"/>
  <text class="title" x="777" y="135">Your agent</text><text class="title" x="777" y="188">builds</text>
  <path class="flow" d="M911 150h42"/>
  <rect class="card" x="964" y="48" width="208" height="204" rx="18"/>
  <text class="title" x="1068" y="135">Check</text><text class="title" x="1068" y="188">+ retain</text>
</svg>
