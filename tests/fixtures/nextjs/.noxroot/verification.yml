version: 1
commands:
  - id: lint
    executable: npm
    args: [run, lint]
    cwd: .
    timeoutMs: 120000
    appliesTo: ["app/**", "components/**", "lib/**", "tests/**"]
  - id: typecheck
    executable: npm
    args: [run, typecheck]
    cwd: .
    timeoutMs: 120000
    appliesTo: ["app/**", "components/**", "lib/**", "tests/**"]
  - id: test
    executable: npm
    args: [run, test]
    cwd: .
    timeoutMs: 120000
    appliesTo: ["app/**", "components/**", "lib/**", "tests/**"]
  - id: build
    executable: npm
    args: [run, build]
    cwd: .
    timeoutMs: 120000
    appliesTo: ["app/**", "components/**", "lib/**"]
